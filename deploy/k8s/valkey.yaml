apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: fleet
spec:
  selector: { app: valkey }
  ports:
    - { port: 6379, targetPort: 6379 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: fleet
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8   # confirme a tag
          args: ["--save", "", "--appendonly", "no"]   # sem persistência: o cache é reconstruível por replay
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 3