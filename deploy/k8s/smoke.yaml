apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke
  namespace: fleet
spec:
  replicas: 1
  selector:
    matchLabels: { app: smoke }
  template:
    metadata:
      labels: { app: smoke }
    spec:
      containers:
        - name: smoke
          image: nginx:alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }