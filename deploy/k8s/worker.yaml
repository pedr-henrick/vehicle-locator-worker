apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: fleet
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: vehicle-locator-worker
          imagePullPolicy: IfNotPresent
          env:
            - { name: Kafka__BootstrapServers, value: "kafka-0.kafka.fleet.svc.cluster.local:9092" }
            - { name: Valkey__ConnectionString, value: "valkey.fleet.svc.cluster.local:6379" }
            - { name: Valkey__Database, value: "0" }
            - { name: Replay__Enabled, value: "false" }